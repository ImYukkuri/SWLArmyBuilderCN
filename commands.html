<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SWL Army Builder CN · 战术卡资料库</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">SWL ARMY BUILDER CN / COMMAND DECK</span><h1>战术卡资料库</h1></div>
    <nav class="tabs-nav">
      <a href="index.html">写表器</a><a href="maintenance.html">数据维护</a>
      <a href="units.html">单位卡</a><a href="upgrades.html">升级卡</a>
      <a href="commands.html" aria-current="page">战术卡</a><a href="armies.html">军表</a><a href="rules.html">规则库</a>
    </nav>
    <div class="row-actions">
      <span id="counts"></span>
      <button id="new-card" class="primary">新建战术卡</button>
      <button id="reload">重新载入</button>
      <button id="export">导出数据</button>
    </div>
  </header>
  <div class="toolbar">
    <input id="search" placeholder="搜索中文、英文或 ID">
    <select id="pip-filter"><option value="">全部点数</option><option value="1">1 点</option><option value="2">2 点</option><option value="3">3 点</option><option value="4">4 点</option></select>
    <select id="art-filter"><option value="">全部</option><option value="missing">缺卡图</option><option value="ready">有卡图</option></select>
  </div>
  <main class="workspace">
    <aside class="list" id="list"></aside>
    <section class="detail">
      <div class="detail-head"><div><h2 id="title">载入中…</h2><p id="subtitle"></p></div><span id="dirty"></span><button id="save" class="primary">保存到源文件</button></div>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="draft-banner" class="draft-banner" hidden></div>
      <div class="tabs"><button data-tab="form" aria-pressed="true">字段编辑</button><button data-tab="image" aria-pressed="false">卡图</button><button data-tab="json" aria-pressed="false">原始 JSON</button><button data-tab="history" aria-pressed="false">文件历史</button></div>
      <div id="form-pane" class="pane"><div id="form" class="form"></div></div>
      <div id="image-pane" class="pane" hidden>
        <div class="row-actions"><button id="image-upload">上传 / 更换卡图</button><input id="image-file" type="file" accept="image/*" hidden></div>
        <p class="hint">保存为 assets/command-cards/&lt;ID&gt;.webp，并写回该卡的 image 字段。</p>
        <img id="card-image" alt="战术卡卡图">
      </div>
      <div id="json-pane" class="pane" hidden><textarea id="raw-json" spellcheck="false"></textarea><div class="row-actions"><button id="apply-json">应用 JSON</button></div></div>
      <div id="history-pane" class="pane" hidden><div id="history"></div></div>
    </section>
  </main>
</div>
<script src="dice-enums.js"></script>
<script src="combo.js"></script>
<script src="command-editor.js"></script>
</body>
</html>
