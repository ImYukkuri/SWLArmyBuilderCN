<header><div><span class="eyebrow">SWL ARMY BUILDER CN / UPGRADE LIBRARY</span><h1>升级卡资料库</h1><nav class="module-nav"><a href="index.html">写表器</a><a href="maintenance.html">数据维护</a><a href="units.html">单位卡</a><a class="active" href="upgrades.html">升级卡</a><a href="armies.html">军表</a><a href="rules.html">规则库</a></nav></div><div id="counts"></div><button id="new-upgrade" class="primary">新建升级卡</button><button id="reload">重新载入</button><button id="export">导出数据</button></header>
